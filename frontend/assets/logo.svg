<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Neon Ring Gradient -->
    <linearGradient id="neonRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="60%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- Pillar / Building Gradient -->
    <linearGradient id="pillarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <!-- Cap Gradient -->
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect x="4" y="4" width="112" height="112" rx="26" ry="26" fill="url(#bgGrad)" stroke="#312E81" stroke-width="1.5" />

  <!-- Outer Neon Glow Ring -->
  <circle cx="60" cy="56" r="38" fill="none" stroke="url(#neonRing)" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)" opacity="0.65" />
  <circle cx="60" cy="56" r="38" fill="none" stroke="url(#neonRing)" stroke-width="3.5" stroke-linecap="round" />

  <!-- Inner Circle Base -->
  <circle cx="60" cy="56" r="30" fill="#0F172A" opacity="0.9" />

  <!-- Integrated Campus Building Pillar -->
  <path d="M48 54 L60 48 L72 54 L72 78 L60 84 L48 78 Z" fill="#1E293B" stroke="#475569" stroke-width="1" />
  <path d="M48 54 L60 48 L60 84 L48 78 Z" fill="url(#pillarGrad)" />
  <path d="M60 48 L72 54 L72 78 L60 84 Z" fill="#3B82F6" opacity="0.9" />

  <!-- Building Windows -->
  <rect x="52" y="58" width="4" height="6" rx="1" fill="#0F172A" />
  <rect x="52" y="68" width="4" height="6" rx="1" fill="#0F172A" />
  <rect x="64" y="58" width="4" height="6" rx="1" fill="#93C5FD" />
  <rect x="64" y="68" width="4" height="6" rx="1" fill="#93C5FD" />

  <!-- Mortarboard Graduation Cap -->
  <polygon points="60,32 84,43 60,51 36,43" fill="url(#capGrad)" stroke="#C7D2FE" stroke-width="1.2" />
  <!-- Cap Tassel -->
  <path d="M42 45 L38 56 L41 58" fill="none" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round" />
  <circle cx="41" cy="58" r="1.5" fill="#38BDF8" />

  <!-- Attendance Verification Checkmark (Top Right) -->
  <path d="M72 40 L80 48 L96 30" fill="none" stroke="#06B6D4" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <path d="M72 40 L80 48 L96 30" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
